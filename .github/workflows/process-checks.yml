name: Process checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: process-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process:
    name: Process checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.9.1
      - name: Check changed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git show --format= --check "$HEAD_SHA"
          fi
      - run: uv sync --locked
      - name: Validate process artifacts
        run: uv run --locked python scripts/check_process.py
      - name: Run validator regression tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Check local documentation links
        run: lychee --offline --include-fragments README.md AGENTS.md 'docs/**/*.md' '.agents/skills/**/*.md' '.github/*.md'
